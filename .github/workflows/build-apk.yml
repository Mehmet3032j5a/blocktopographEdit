name: Build debug APK

on:
  push:
    branches: [ player-names-clear-entities ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # AGP 7.4 / Gradle 7.5 build fine on JDK 17.
      # The leveldb-mcpe submodule is listed in .gitmodules but not committed as a gitlink, and
      # Mojang/leveldb-mcpe is no longer public, so try known forks until one has the sources.
      - name: Fetch leveldb-mcpe sources
        run: |
          dest=leveldb/src/main/cpp/leveldb-mcpe
          complete() {
            missing=0
            for f in $(grep -o 'leveldb-mcpe/[A-Za-z0-9_/]*\.cc' leveldb/src/main/cpp/Android.mk | sort -u); do
              [ -f "leveldb/src/main/cpp/$f" ] || { echo "  missing $f"; missing=1; }
            done
            return $missing
          }
          complete >/dev/null 2>&1 && exit 0
          for repo in The-HeX/leveldb-mcpe jocopa3/leveldb-mcpe ddsswifttech/leveldb-mcpe DaanV2/leveldb-mcpe.Net JJJollyjim/leveldb-mcpe; do
            echo "== trying $repo"
            rm -rf $dest
            if GIT_TERMINAL_PROMPT=0 git clone --depth 1 https://github.com/$repo.git $dest && complete; then
              echo "Using $repo"; exit 0
            fi
          done
          echo "No fork had every source file listed in Android.mk"; exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK / NDK pieces
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-31" "platforms;android-29" "build-tools;30.0.3" "ndk;21.4.7075529"

      # google-services.json is not in the repo; a placeholder is enough to build a debug APK.
      - name: Placeholder google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"000000000000","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"rukiroki.blocktopograph"}},"api_key":[{"current_key":"placeholder"}]}],"configuration_version":"1"}
          JSON
          fi

      - name: Build
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: blocktopograph-debug-apk
          path: app/build/outputs/apk/debug/*.apk
