name: Build debug APK

on:
  push:
    branches: [ player-names-clear-entities ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # AGP 7.4 / Gradle 7.5 build fine on JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK / NDK pieces
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-31" "platforms;android-29" "build-tools;30.0.3" "ndk;21.4.7075529"

      # google-services.json is not in the repo; a placeholder is enough to build a debug APK.
      - name: Placeholder google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"000000000000","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"rukiroki.blocktopograph"}},"api_key":[{"current_key":"placeholder"}]}],"configuration_version":"1"}
          JSON
          fi

      - name: Build
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: blocktopograph-debug-apk
          path: app/build/outputs/apk/debug/*.apk
