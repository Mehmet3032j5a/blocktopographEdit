name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [custom-dimension]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # leveldb native code lives in a git submodule that is missing from a plain upload.
      - name: Fetch leveldb-mcpe
        run: |
          rm -rf leveldb/src/main/cpp/leveldb-mcpe
          # Mojang/leveldb-mcpe was removed from GitHub; this is a copy of it with the same file layout.
          git clone https://github.com/ddsswifttech/leveldb-mcpe.git leveldb/src/main/cpp/leveldb-mcpe
          git -C leveldb/src/main/cpp/leveldb-mcpe checkout 82785f08c44905d7e8f8bdf9488c9d56c4257db9

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK / NDK
        run: |
          SDK=$ANDROID_HOME
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-29" "platforms;android-31" "build-tools;29.0.3" "ndk;21.4.7075529"
          echo "sdk.dir=$SDK" > local.properties
          echo "ndk.dir=$SDK/ndk/21.4.7075529" >> local.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: blocktopograph-apk
          path: app/build/outputs/apk/**/*.apk

      # Publish the APK as a release so it can be downloaded straight from a phone browser.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          cp "$APK" blocktopograph-customdim.apk
          gh release create "apk-${{ github.run_number }}" blocktopograph-customdim.apk \
            --title "Blocktopograph custom dimension build ${{ github.run_number }}" \
            --notes "Debug APK with custom dimension (id 1000+) support." --target "${{ github.sha }}"
